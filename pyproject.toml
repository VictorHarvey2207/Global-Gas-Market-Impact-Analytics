[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-gas-market-impact-analytics"
version = "0.1.0"
description = "Chronological oil-price forecasting with PySpark and Spark MLlib"
requires-python = ">=3.10,<3.14"
dependencies = ["pyspark==4.0.1", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
gas-analytics = "gas_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: requires a local Spark runtime and Java 17+"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
